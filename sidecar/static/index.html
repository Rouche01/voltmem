<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoltMem memory browser</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --panel: #fffdf8;
      --ink: #1c1915;
      --muted: #5e574c;
      --line: #ddd4c6;
      --accent: #0f3d3e;
      --accent-soft: #e5f1f0;
      --danger: #8c2f2f;
      --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 ui-sans-serif, "Segoe UI", sans-serif;
    }

    header, main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 16px 24px;
      padding: 24px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    h1 span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    #connect {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: end;
      margin-left: auto;
    }

    label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
      color: var(--ink);
    }

    input, select {
      min-width: 12rem;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    button {
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #f7fffe;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, .row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #status {
      width: 100%;
      min-height: 1.2em;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #status.is-error { color: var(--danger); }

    .hint {
      width: 100%;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    .toolbar button,
    .view-toggle button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .view-toggle {
      display: flex;
    }

    .view-toggle button {
      border-radius: 0;
    }

    .view-toggle button:first-child { border-radius: 8px 0 0 8px; }
    .view-toggle button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }

    .view-toggle button[aria-pressed="true"] {
      background: var(--accent);
      color: #f7fffe;
    }

    #graph-wrap { min-height: 480px; }
    #graph { display: block; width: 100%; }
    #graph .edge-supersedes { stroke: #1c1915; stroke-width: 1.5; }
    #graph .edge-facet { stroke: #8a8175; stroke-width: 1.25; stroke-dasharray: 4 3; }
    #graph .node { cursor: pointer; }
    #graph .node.is-inactive { opacity: 0.38; }
    #graph .node text {
      font-size: 11px;
      fill: #1c1915;
      font-family: ui-sans-serif, "Segoe UI", sans-serif;
    }
    #graph .node.is-selected circle { stroke: #1c1915; stroke-width: 2.5; }
    #graph-legend { margin: 8px 4px 0; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 16px;
      padding-bottom: 32px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      min-height: 420px;
      padding: 12px;
    }

    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    #list[hidden],
    #graph-wrap[hidden] {
      display: none;
    }

    .row {
      width: 100%;
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .row.is-selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .row .memory {
      font-size: 0.98rem;
    }

    .row .meta, .empty, .secondary {
      color: var(--muted);
      font-size: 0.82rem;
    }

    #detail h2 {
      margin: 4px 0 12px;
      font-size: 1.15rem;
      line-height: 1.35;
    }

    #scores {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 14px;
    }

    #scores div {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg);
    }

    #scores dt {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #scores dd {
      margin: 2px 0 0;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.95rem;
    }

    @media (max-width: 800px) {
      header, main { width: min(1100px, calc(100% - 20px)); }
      #connect { margin-left: 0; }
      input, select { min-width: 0; width: 100%; }
      .workspace { grid-template-columns: 1fr; }
      .panel { min-height: 0; }
    }
  </style>
</head>
<body id="memory-browser">
  <header>
    <h1>VoltMem <span>Memory browser</span></h1>
    <form id="connect">
      <label>API key
        <input id="api-key" type="password" autocomplete="off" spellcheck="false">
      </label>
      <label>Tenant
        <input id="user-id" type="text" required placeholder="relay-local" autocomplete="off" title="Isolation boundary, such as relay-local or alice">
      </label>
      <button type="submit">Connect</button>
    </form>
    <p id="status" role="status"></p>
  </header>
  <main>
    <div class="toolbar">
      <label>Text
        <input id="filter-text" type="search" placeholder="Substring">
      </label>
      <label>Domain (kind)
        <select id="filter-domain" title="Fact kind from the profile classifier, or the domain supplied on write">
          <option value="">All kinds</option>
        </select>
      </label>
      <label>Source
        <input id="filter-source" type="search" placeholder="Substring">
      </label>
      <button id="refresh" type="button">Refresh</button>
      <div class="view-toggle" role="group" aria-label="View">
        <button id="view-list" type="button" aria-pressed="true">List</button>
        <button id="view-graph" type="button" aria-pressed="false">Graph</button>
      </div>
    </div>
    <p class="hint">Domain is the fact kind: profile classifier, or supplied on write.</p>
    <div class="workspace">
      <section class="panel" id="browser-pane" aria-label="Memories">
        <ul id="list"></ul>
        <div id="graph-wrap" hidden>
          <svg id="graph" role="img" aria-label="Memory graph"></svg>
          <p id="graph-legend" class="secondary"></p>
        </div>
      </section>
      <section class="panel" id="detail" aria-live="polite">
        <p class="empty">Select a memory to inspect scoring.</p>
      </section>
    </div>
  </main>
  <script>
    const STORAGE_KEY = "voltmem.browser";
    const scoreFields = [
      ["Volatility", "effective_volatility"],
      ["Protection", "protection_weight"],
      ["Staleness", "staleness"],
      ["Surprise", "surprise_ema"],
      ["Mismatch", "expected_mismatch"],
      ["Age (days)", "age_days"],
    ];

    const statusEl = document.getElementById("status");
    const SVG_NS = "http://www.w3.org/2000/svg";
    const DOMAIN_COLORS = ["#0f3d3e", "#8c4a2f", "#3d5a80", "#6b4c7a", "#2f6b4f", "#8a6a2f", "#7a3b4a", "#3f5e4a"];
    const listEl = document.getElementById("list");
    const graphWrap = document.getElementById("graph-wrap");
    const graphEl = document.getElementById("graph");
    const legendEl = document.getElementById("graph-legend");
    const detailEl = document.getElementById("detail");
    const domainEl = document.getElementById("filter-domain");
    const textEl = document.getElementById("filter-text");
    const sourceEl = document.getElementById("filter-source");
    const viewListBtn = document.getElementById("view-list");
    const viewGraphBtn = document.getElementById("view-graph");

    let session = { apiKey: "", userId: "" };
    let memories = [];
    let graph = { nodes: [], edges: [] };
    let selectedId = "";
    let loadError = "";
    let view = "list";

    function setStatus(message, isError) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("is-error", Boolean(isError));
    }

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed.userId !== "string") return null;
        return {
          apiKey: typeof parsed.apiKey === "string" ? parsed.apiKey : "",
          userId: parsed.userId,
        };
      } catch (_err) {
        return null;
      }
    }

    function saveSession() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(session));
    }

    async function api(path) {
      const headers = {};
      if (session.apiKey) headers["X-API-Key"] = session.apiKey;
      const response = await fetch(path, { headers });
      if (response.status === 401) {
        throw new Error("API key was rejected.");
      }
      if (!response.ok) {
        throw new Error("Request failed (" + response.status + ").");
      }
      return response.json();
    }

    function userPath() {
      return "/v1/tenants/" + encodeURIComponent(session.userId);
    }

    function matches(item) {
      const text = textEl.value.trim().toLowerCase();
      const source = sourceEl.value.trim().toLowerCase();
      const domain = domainEl.value;
      if (domain && item.domain !== domain) return false;
      if (source && !String(item.source || "").toLowerCase().includes(source)) return false;
      if (text && !String(item.memory || "").toLowerCase().includes(text)) return false;
      return true;
    }

    function fillDomains() {
      const current = domainEl.value;
      const source = graph.nodes.length ? graph.nodes : memories;
      const domains = Array.from(new Set(source.map((item) => item.domain).filter(Boolean))).sort();
      domainEl.replaceChildren(new Option("All kinds", ""));
      for (const domain of domains) domainEl.append(new Option(domain, domain));
      domainEl.value = domains.includes(current) ? current : "";
    }

    function domainColor(domain) {
      const text = domain || "unknown";
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      return DOMAIN_COLORS[hash % DOMAIN_COLORS.length];
    }

    function layoutGraph(nodes, edges, width, height) {
      const placed = nodes.map((node) => ({ ...node, x: width / 2, y: height / 2, vx: 0, vy: 0 }));
      const domains = Array.from(new Set(placed.map((node) => node.domain || "unknown")));
      const homes = new Map();
      domains.forEach((domain, index) => {
        const angle = (index / Math.max(domains.length, 1)) * Math.PI * 2 - Math.PI / 2;
        const radius = Math.min(width, height) * 0.28;
        homes.set(domain, {
          x: width / 2 + Math.cos(angle) * radius,
          y: height / 2 + Math.sin(angle) * radius,
        });
      });
      const seen = new Map();
      for (const node of placed) {
        const key = node.domain || "unknown";
        const count = seen.get(key) || 0;
        seen.set(key, count + 1);
        const home = homes.get(key);
        node.x = home.x + Math.cos(count * 0.9) * 16;
        node.y = home.y + Math.sin(count * 0.9) * 16;
      }
      const byId = new Map(placed.map((node) => [node.id, node]));
      const links = edges.filter((edge) =>
        (edge.kind === "supersedes" || edge.kind === "facet")
        && byId.has(edge.source) && byId.has(edge.target)
      );
      for (let tick = 0; tick < 160; tick++) {
        for (let i = 0; i < placed.length; i++) {
          for (let j = i + 1; j < placed.length; j++) {
            const dx = placed[j].x - placed[i].x;
            const dy = placed[j].y - placed[i].y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const force = 820 / (dist * dist);
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;
            placed[i].vx -= fx;
            placed[i].vy -= fy;
            placed[j].vx += fx;
            placed[j].vy += fy;
          }
        }
        for (const edge of links) {
          const a = byId.get(edge.source);
          const b = byId.get(edge.target);
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const rest = edge.kind === "supersedes" ? 96 : 72;
          const mag = (dist - rest) * 0.045;
          const fx = (dx / dist) * mag;
          const fy = (dy / dist) * mag;
          a.vx += fx;
          a.vy += fy;
          b.vx -= fx;
          b.vy -= fy;
        }
        for (const node of placed) {
          const home = homes.get(node.domain || "unknown");
          node.vx += (home.x - node.x) * 0.025;
          node.vy += (home.y - node.y) * 0.025;
        }
        const pad = 28;
        for (const node of placed) {
          node.vx *= 0.72;
          node.vy *= 0.72;
          node.x = Math.max(pad, Math.min(width - pad, node.x + node.vx));
          node.y = Math.max(pad, Math.min(height - 36, node.y + node.vy));
        }
      }
      return { placed, links, byId };
    }

    function renderGraph() {
      graphEl.replaceChildren();
      const shown = (graph.nodes || []).filter(matches);
      if (!session.userId) {
        legendEl.textContent = "Connect with a tenant to load the graph.";
        return;
      }
      if (loadError) {
        legendEl.textContent = loadError;
        return;
      }
      if (!(graph.nodes || []).length) {
        legendEl.textContent = "No memories to draw for this tenant.";
        return;
      }
      if (!shown.length) {
        legendEl.textContent = "No memories match these filters.";
        return;
      }
      const width = Math.max(320, graphWrap.clientWidth || 640);
      const height = 460;
      graphEl.setAttribute("viewBox", "0 0 " + width + " " + height);
      graphEl.setAttribute("height", String(height));
      const visible = new Set(shown.map((node) => node.id));
      const edges = (graph.edges || []).filter((edge) => visible.has(edge.source) && visible.has(edge.target));
      const { placed, links, byId } = layoutGraph(shown, edges, width, height);
      for (const edge of links) {
        const source = byId.get(edge.source);
        const target = byId.get(edge.target);
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", source.x);
        line.setAttribute("y1", source.y);
        line.setAttribute("x2", target.x);
        line.setAttribute("y2", target.y);
        line.setAttribute("class", "edge-" + edge.kind);
        graphEl.append(line);
      }
      for (const node of placed) {
        const group = document.createElementNS(SVG_NS, "g");
        group.setAttribute("class", "node" + (node.active ? "" : " is-inactive") + (node.id === selectedId ? " is-selected" : ""));
        group.setAttribute("tabindex", "0");
        group.setAttribute("role", "button");
        group.setAttribute("aria-label", (node.memory || node.id) + (node.active ? "" : ", replaced"));
        const text = node.memory || "";
        const shownText = text.length > 42 ? text.slice(0, 41) + "…" : text;
        const hit = document.createElementNS(SVG_NS, "rect");
        const hitWidth = Math.min(180, Math.max(56, shownText.length * 6.4));
        hit.setAttribute("x", node.x - hitWidth / 2);
        hit.setAttribute("y", node.y - 16);
        hit.setAttribute("width", hitWidth);
        hit.setAttribute("height", 44);
        hit.setAttribute("fill", "transparent");
        const circle = document.createElementNS(SVG_NS, "circle");
        circle.setAttribute("cx", node.x);
        circle.setAttribute("cy", node.y);
        circle.setAttribute("r", node.id === selectedId ? 11 : 8);
        circle.setAttribute("fill", domainColor(node.domain));
        const label = document.createElementNS(SVG_NS, "text");
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("x", node.x);
        label.setAttribute("y", node.y + 22);
        label.textContent = shownText;
        group.append(hit, circle, label);
        const open = () => selectMemory(node.id);
        group.addEventListener("click", open);
        group.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
        graphEl.append(group);
      }
      const kinds = new Set(links.map((edge) => edge.kind));
      const parts = ["Color is domain (kind)."];
      if (placed.some((node) => !node.active)) parts.push("Faded nodes are replaced.");
      if (kinds.has("supersedes")) parts.push("Solid line replaces.");
      if (kinds.has("facet")) parts.push("Dashed line shares an event.");
      if (!kinds.size) parts.push("No replacement or shared-event links yet.");
      legendEl.textContent = parts.join(" ");
    }

    function renderView() {
      const graphMode = view === "graph";
      listEl.hidden = graphMode;
      graphWrap.hidden = !graphMode;
      viewListBtn.setAttribute("aria-pressed", graphMode ? "false" : "true");
      viewGraphBtn.setAttribute("aria-pressed", graphMode ? "true" : "false");
      if (graphMode) renderGraph();
      else renderList();
    }

    function renderList() {
      const shown = memories.filter(matches);
      listEl.replaceChildren();
      if (!session.userId) {
        listEl.append(emptyItem("Connect with a tenant to load memories."));
        return;
      }
      if (loadError) {
        listEl.append(emptyItem(loadError));
        return;
      }
      if (!memories.length) {
        listEl.append(emptyItem("No active memories for this tenant."));
        return;
      }
      if (!shown.length) {
        listEl.append(emptyItem("No memories match these filters."));
        return;
      }
      for (const item of shown) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "row" + (item.id === selectedId ? " is-selected" : "");
        button.setAttribute("aria-pressed", item.id === selectedId ? "true" : "false");
        const memory = document.createElement("span");
        memory.className = "memory";
        memory.textContent = item.memory || "";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = (item.domain || "unknown") + " · " + (item.source || "unknown");
        button.append(memory, meta);
        button.addEventListener("click", () => selectMemory(item.id));
        const li = document.createElement("li");
        li.append(button);
        listEl.append(li);
      }
    }

    function emptyItem(message) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = message;
      return li;
    }

    function formatNumber(value) {
      if (typeof value !== "number" || Number.isNaN(value)) return "—";
      return String(Math.round(value * 10000) / 10000);
    }

    function renderDetail(info) {
      detailEl.replaceChildren();
      const title = document.createElement("h2");
      title.textContent = info.content || "";
      const scores = document.createElement("dl");
      scores.id = "scores";
      for (const [label, key] of scoreFields) {
        const wrap = document.createElement("div");
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = formatNumber(info[key]);
        wrap.append(dt, dd);
        scores.append(wrap);
      }
      const extra = document.createElement("p");
      extra.className = "secondary";
      const active = info.active ? "active" : "inactive";
      extra.textContent = [
        info.domain || "unknown domain",
        info.source || "unknown source",
        active,
        "repetitions " + (info.repetition_count ?? "—"),
        "mismatch count " + (info.mismatch_count ?? "—"),
        "mismatch sigma " + formatNumber(info.mismatch_sigma),
        "days since confirmed " + formatNumber(info.days_since_confirmed),
      ].join(" · ");
      detailEl.append(title, scores, extra);
    }

    async function selectMemory(id) {
      selectedId = id;
      renderView();
      setStatus("Loading inspect…");
      try {
        const info = await api(userPath() + "/memories/" + encodeURIComponent(id));
        renderDetail(info);
        setStatus("");
      } catch (err) {
        detailEl.replaceChildren();
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = err.message || "Could not load this memory.";
        detailEl.append(note);
        setStatus(note.textContent, true);
      }
    }

    async function loadMemories() {
      if (!session.userId) {
        memories = [];
        graph = { nodes: [], edges: [] };
        renderView();
        setStatus("Enter a tenant.", true);
        return;
      }
      setStatus("Loading memories…");
      loadError = "";
      try {
        const listed = await api(userPath() + "/memories");
        const plotted = await api(userPath() + "/graph");
        memories = Array.isArray(listed) ? listed : [];
        graph = plotted && Array.isArray(plotted.nodes) ? plotted : { nodes: [], edges: [] };
        if (!Array.isArray(graph.edges)) graph.edges = [];
        fillDomains();
        renderView();
        const replaced = graph.nodes.filter((node) => !node.active).length;
        const summary = memories.length + " active " + (memories.length === 1 ? "memory" : "memories");
        setStatus(replaced ? summary + " · " + replaced + " replaced" : summary);
        const known = memories.some((item) => item.id === selectedId)
          || graph.nodes.some((node) => node.id === selectedId);
        if (selectedId && known) {
          await selectMemory(selectedId);
        } else if (selectedId) {
          selectedId = "";
          detailEl.replaceChildren();
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent = "Select a memory to inspect scoring.";
          detailEl.append(note);
        }
      } catch (err) {
        memories = [];
        graph = { nodes: [], edges: [] };
        loadError = err.message || "Could not load memories.";
        renderView();
        setStatus(loadError, true);
      }
    }

    document.getElementById("connect").addEventListener("submit", (event) => {
      event.preventDefault();
      session = {
        apiKey: document.getElementById("api-key").value,
        userId: document.getElementById("user-id").value.trim(),
      };
      saveSession();
      selectedId = "";
      loadMemories();
    });

    document.getElementById("refresh").addEventListener("click", () => loadMemories());
    textEl.addEventListener("input", renderView);
    sourceEl.addEventListener("input", renderView);
    domainEl.addEventListener("change", renderView);
    viewListBtn.addEventListener("click", () => {
      view = "list";
      renderView();
    });
    viewGraphBtn.addEventListener("click", () => {
      view = "graph";
      renderView();
    });
    window.addEventListener("resize", () => {
      if (view === "graph") renderGraph();
    });

    const stored = loadSession();
    if (stored) {
      session = stored;
      document.getElementById("api-key").value = session.apiKey;
      document.getElementById("user-id").value = session.userId;
      loadMemories();
    } else {
      renderView();
      setStatus("Enter an API key and tenant. The key stays in this tab.");
    }
  </script>
</body>
</html>
