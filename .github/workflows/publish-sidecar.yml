name: publish-sidecar

on:
  push:
    tags:
      - "sidecar-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: voltmem-sidecar
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            embeddings: "1"
          - variant: slim
            embeddings: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          if [[ "${{ github.ref }}" == refs/tags/sidecar-v* ]]; then
            VERSION="${GITHUB_REF_NAME#sidecar-v}"
            if [[ "$VARIANT" == "slim" ]]; then
              echo "tags=${IMAGE}:${VERSION}-slim,${IMAGE}:slim" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            if [[ "$VARIANT" == "slim" ]]; then
              echo "tags=${IMAGE}:sha-${SHA_SHORT}-slim" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: EMBEDDINGS=${{ matrix.embeddings }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
