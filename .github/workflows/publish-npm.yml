name: Publish to NPM

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

defaults:
  run:
    working-directory: clients/typescript

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install and test
        run: |
          npm ci
          npm test

      # Auth is OIDC via trusted publisher — no NPM_TOKEN / NODE_AUTH_TOKEN.
      # Provenance attestations are generated automatically on trusted publish.
      - name: Publish @voltmem/client
        run: npm publish --access public
