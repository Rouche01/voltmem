name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/voltmem/
    # Ignore client-v* / sidecar-v* if a future tag pattern ever overlaps.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Reject accidental matches like "v" alone or non-semver leftovers.
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a library version tag (expected vX.Y.Z)"
            exit 1
          fi
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sidecar]"
          pip install build

      - name: Run core release tests
        env:
          VOLTMEM_EMBEDDINGS: "0"
          VOLTMEM_MAINTENANCE: "0"
        run: |
          python tests/test_voltmem.py
          python tests/test_lean_oracle.py
          python tests/test_client.py
          python tests/test_sidecar.py

      - name: Build sdist and wheel
        run: python -m build

      # Auth is OIDC via trusted publisher — no TWINE_PASSWORD / API token.
      # Configure on PyPI: project → Publishing → Trusted publishers →
      #   owner Rouche01, repo voltmem, workflow publish-pypi.yml, environment release
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
